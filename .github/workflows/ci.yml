# Lab 8 - Continuous Integration: every push / pull request rebuilds the model
# artefacts and runs the pytest suite (data schema, preprocessing, model quality gate, API).
name: CI - tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Build artefacts (Labs 5-7)
        run: |
          python pipelines/run_lab5_pipeline.py
          python pipelines/run_lab6_registry.py
          python src/export_production_model.py

      - name: Run tests
        run: python -m pytest tests -v --junitxml=artifacts/test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/
